    <!-- Apply saved theme before first paint to prevent flash -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('hvflow-theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
          else if (t === 'vibe') document.documentElement.classList.add('vibe');
        } catch(e) {}
      })();
    </script>

      if (_allowed && window.BugReporter != null && window.BugReporter) {
        window.BugReporter.init({
          apiUrl: "https://pm-api.vegasoft.vn/v1/bot-agents/create-bug",
